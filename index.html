<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>كوز متكس | تواصل عبر واتساب</title>
<meta name="description" content="تواصل مع كوز متكس عبر واتساب لحجز طلبك بسرعة.">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#080a09;color:#fff;font-family:Arial,Tahoma,sans-serif}
body{min-height:100vh}
.wrap{max-width:720px;margin:auto;background:#0a0c0b;min-height:100vh}
.hero{display:block;width:100%;height:auto}
.order{padding:24px 20px 30px;text-align:center;background:linear-gradient(180deg,#0b0e0c,#050706)}
.order h2{font-size:clamp(22px,5.2vw,32px);margin:0 0 12px;font-weight:800}
.order p{font-size:clamp(17px,4.2vw,21px);line-height:1.8;color:#e7e7e7;margin:0 auto 20px;max-width:600px}
.order strong{color:#fff}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:18px;background:#08a83c;color:#fff;text-decoration:none;font-size:clamp(19px,4.8vw,25px);font-weight:800;box-shadow:0 8px 28px rgba(0,190,70,.22)}
.note{font-size:14px!important;color:#aaa!important;margin-top:13px!important}

form{display:grid;gap:13px;margin-top:18px}
input{
  width:100%;min-height:58px;border:1px solid #303632;border-radius:14px;
  background:#111512;color:#fff;padding:0 17px;font-size:18px;
  outline:none;text-align:right
}
input:focus{border-color:#08a83c}
input::placeholder{color:#aeb5b0}
button.wa{border:0;cursor:pointer;font-family:inherit}


html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{overflow-x:hidden}
.hero{aspect-ratio:760/1350;object-fit:cover}
input,button{font:inherit}
button,input{-webkit-tap-highlight-color:transparent}
.wa{touch-action:manipulation}
@media (max-width:480px){
  .order{padding:22px 16px 28px}
  input{min-height:56px;font-size:16px}
  .wa{min-height:60px}
}

</style>




<style>
/* Only the green WhatsApp CTA buttons are intended to be clickable. */
html, body, main, section, div, img, p, h1, h2, h3, span { cursor: default; }
a[href*="wa.me"], button[type="submit"], .wa-logo-click { cursor: pointer; }
</style>


<style>
.hero-click-map{position:relative;width:100%;line-height:0}
.hero-click-map .hero{display:block;width:100%;height:auto}
.hotspot{
  position:absolute;
  display:block;
  z-index:20;
  cursor:pointer;
  background:transparent;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
/* Exact clickable areas only; percentages scale correctly on mobile */
.hs-logo{left:25%;top:41%;width:50%;height:25%}
.hs-top{left:7%;top:71.5%;width:86%;height:10.5%}
.hs-bottom{left:14%;top:63.5%;width:72%;height:8.5%}
</style>

</head>
